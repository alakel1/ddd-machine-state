name: ddd-machine-status

services:
  backend:
    image: python:3.12-slim
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
      - ./frontend/dist:/app/frontend/dist:ro
      - pip-cache:/root/.cache/pip
    environment:
      DDD_DB: /app/backend/ddd.sqlite3
      PYTHONUNBUFFERED: "1"
    command: >
      sh -c "pip install -q -r requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
    ports:
      - "8010:8000"
    restart: unless-stopped

  frontend:
    image: node:20-bookworm-slim
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
      - node-modules:/app/frontend/node_modules
    environment:
      API_TARGET: http://backend:8000
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    ports:
      - "5180:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pip-cache:
  node-modules:
